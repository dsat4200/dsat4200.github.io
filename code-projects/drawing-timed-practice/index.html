<style>
  .readme-content {
    text-align: left;
    padding: 20px 40px;
    max-width: 900px;
    margin: 0 auto;
  }

  .readme-content h1 {

  .readme-box {
    background: #0d1117;
    border-radius: 14pt;
    padding: 32px;

    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    text-align: left;
  }
</style>
<script>
  (async function() {
    const el = document.getElementById('readme-body');
    try {
      const res = await fetch('https://api.github.com/repos/dsat4200/Drawing-Timed-Practice/readme');
      if (!res.ok) throw new Error('GitHub API error: ' + res.status);
      const data = await res.json();
      const bytes = Uint8Array.from(atob(data.content), c => c.charCodeAt(0));
      let md = new TextDecoder('utf-8').decode(bytes);

      const branch = 'main';
      const rawBase = `https://raw.githubusercontent.com/dsat4200/Drawing-Timed-Practice/${branch}/`;
      md = md.replace(/\]\(\.\/(?!http)/g, '](' + rawBase);
      md = md.replace(/\]\(readme\//g, '](' + rawBase + 'readme/');

      const html = marked.parse(md);
      el.innerHTML = `<article class="markdown-body">${html}</article>`;
    } catch (e) {
      el.innerHTML = '<p style="color:#f85149;text-align:center;">Failed to load README from GitHub. <a href="https://github.com/dsat4200/Drawing-Timed-Practice" target="_blank" style="color:rgb(148,95,255);">View on GitHub</a></p>';
      console.error(e);
    }
  })();
</script>
